<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site footer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.pf{--paper:#F5F7F8;--surface:#FFFFFF;--ink:#141A22;--muted:#5A6472;--line:#DCE1E6;--jade:#0D7663;--jade-soft:#DCEFEA;--amber:#A86A12;--amber-soft:#F6EBD9;--on-jade:#FFFFFF;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}
.pf.dark{--paper:#0E1216;--surface:#151B21;--ink:#E6EBF0;--muted:#9AA5B1;--line:#27303A;--jade:#43C2A8;--jade-soft:#15302A;--amber:#E2A64C;--amber-soft:#33270F;--on-jade:#0E1216}
.pf p{margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.label{font:600 12px/1.3 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1040px;margin:0 auto;padding-left:24px;padding-right:24px;box-sizing:border-box}
.flink{color:var(--ink);text-decoration:none}
.flink:hover{color:var(--jade)}
.seg{min-height:36px;padding:0 12px;border:0;background:transparent;color:var(--muted);font:500 13px/1 Inter,sans-serif;border-radius:6px;cursor:pointer}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
@media (max-width:760px){.cols-sm-1{grid-template-columns:minmax(0,1fr)!important}}
</style>
</helmet>
<footer class="pf {{themeClass}}" style="border-top: 1px solid var(--line)">
<div class="wrap cols-sm-1" style="display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 32px; padding-top: 40px; padding-bottom: 40px">
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="font: 700 18px/1 'Bricolage Grotesque', Inter, sans-serif">Hai Son Nguyen<span style="color: var(--jade)">.</span></p>
<p style="font-size: 14px; color: var(--muted)">Senior Frontend Engineer in Hanoi. Vue, Nuxt, the server side of my apps, and AI workflows.</p>
<p class="mono" style="font-size: 12px; color: var(--muted)">This site: Lighthouse [N], [N] KB of JavaScript, built with Nuxt.</p>
</div>
<nav aria-label="Footer" style="display: flex; flex-direction: column; gap: 8px; font-size: 15px">
<span class="label">Site</span>
<sc-for list="{{site}}" as="l" hint-placeholder-count="5"><a class="flink" href="{{l.href}}">{{l.label}}</a></sc-for>
</nav>
<div style="display: flex; flex-direction: column; gap: 8px; font-size: 15px">
<span class="label">Elsewhere</span>
<sc-for list="{{elsewhere}}" as="l" hint-placeholder-count="3"><a class="flink" href="{{l.href}}">{{l.label}}</a></sc-for>
<span class="label" style="padding-top: 12px">Theme</span>
<div role="group" aria-label="Theme" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--paper); border: 1px solid var(--line); align-self: start">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="3"><button type="button" class="seg {{t.cls}}" aria-pressed="{{t.pressed}}">{{t.label}}</button></sc-for>
</div>
</div>
</div>
<div class="wrap" style="padding-bottom: 28px; font-size: 13px; color: var(--muted)">© 2026 Hai Son Nguyen</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"upwork":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":240}}'>
class Component extends DCLogic {
renderVals() {
const upwork = !!this.props.upwork;
const theme = this.props.theme ?? 'light';
const site = [
{ label: 'Work', href: 'Work.dc.html' }, { label: 'Services', href: 'Services.dc.html' },
{ label: 'Lab', href: 'Lab.dc.html' }, { label: 'About', href: 'About.dc.html' }, { label: 'CV', href: 'CV.dc.html' }
];
if (!upwork) site.push({ label: 'Contact', href: 'Contact.dc.html' });
const elsewhere = upwork
? [{ label: 'GitHub', href: 'https://github.com/son-nguyen-301' }, { label: 'Upwork', href: 'https://www.upwork.com/freelancers/~010a5da72f7f0ba777' }]
: [{ label: 'LinkedIn', href: 'https://www.linkedin.com/in/hai-son-nguyen-23a16118a' }, { label: 'GitHub', href: 'https://github.com/son-nguyen-301' }, { label: 'Upwork', href: 'https://www.upwork.com/freelancers/~010a5da72f7f0ba777' }];
const themes = ['Light', 'Dark', 'System'].map(l => {
const on = l.toLowerCase() === theme;
return { label: l, cls: on ? 'on' : '', pressed: on ? 'true' : 'false' };
});
return { site, elsewhere, themes, themeClass: theme === 'dark' ? 'dark' : '' };
}
}
</script>
</body>
</html>

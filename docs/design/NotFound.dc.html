<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Page not found</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.pf{--paper:#F5F7F8;--surface:#FFFFFF;--ink:#141A22;--muted:#5A6472;--line:#DCE1E6;--jade:#0D7663;--jade-soft:#DCEFEA;--on-jade:#FFFFFF;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}
.pf.dark{--paper:#0E1216;--surface:#151B21;--ink:#E6EBF0;--muted:#9AA5B1;--line:#27303A;--jade:#43C2A8;--jade-soft:#15302A;--on-jade:#0E1216}
.pf h1{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;margin:0;line-height:1.12}
.pf p{margin:0}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1040px;margin:0 auto;padding-left:24px;padding-right:24px;box-sizing:border-box}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;font:600 15px/1 Inter,system-ui,sans-serif;text-decoration:none;border:1px solid transparent;box-sizing:border-box}
.btn-primary{background:var(--ink);color:var(--paper)!important}
.btn-ghost{background:transparent;color:var(--ink)!important;border-color:var(--line)}
</style>
</helmet>
<div class="pf {{themeClass}}" style="min-height: 100vh">
<dc-import name="SiteHeader" theme="{{theme}}" upwork="{{upwork}}" active="none" hint-size="100%,72px"></dc-import>
<main class="wrap" style="padding-top: 120px; padding-bottom: 140px; display: flex; flex-direction: column; gap: 18px; align-items: flex-start">
<p class="mono" style="font-size: 64px; font-weight: 600; color: var(--jade); line-height: 1">404</p>
<h1 style="font-size: 40px">This page doesn't exist</h1>
<p style="font-size: 18px; color: var(--muted); max-width: 52ch">The link may be old, or there may be a typo in it. These two pages are a good place to start.</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap; padding-top: 8px">
<a class="btn btn-primary" href="Main.dc.html">Go to the home page</a>
<a class="btn btn-ghost" href="Work.dc.html">See my work</a>
</div>
</main>
<dc-import name="SiteFooter" theme="{{theme}}" upwork="{{upwork}}" hint-size="100%,220px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"upwork":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
renderVals() {
const theme = this.props.theme ?? 'light';
return { theme, upwork: !!this.props.upwork, themeClass: theme === 'dark' ? 'dark' : '' };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.pf{--paper:#F5F7F8;--surface:#FFFFFF;--ink:#141A22;--muted:#5A6472;--line:#DCE1E6;--jade:#0D7663;--jade-soft:#DCEFEA;--amber:#A86A12;--amber-soft:#F6EBD9;--on-jade:#FFFFFF;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}
.pf.dark{--paper:#0E1216;--surface:#151B21;--ink:#E6EBF0;--muted:#9AA5B1;--line:#27303A;--jade:#43C2A8;--jade-soft:#15302A;--amber:#E2A64C;--amber-soft:#33270F;--on-jade:#0E1216}
.pf h1,.pf h2,.pf h3{font-family:"Bricolage Grotesque",Inter,system-ui,sans-serif;margin:0;line-height:1.12;text-wrap:balance}
.pf p{margin:0}
.pf a{color:var(--jade);text-underline-offset:3px}
.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.label{font:600 12px/1.3 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1040px;margin:0 auto;padding-left:24px;padding-right:24px;box-sizing:border-box}
.tag{font:500 12px/1 "JetBrains Mono",monospace;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
.pill{font:600 11px/1 "JetBrains Mono",monospace;padding:5px 8px;border-radius:999px;background:var(--amber-soft);color:var(--amber)}
.pill.live{background:var(--jade-soft);color:var(--jade)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.shot{background:repeating-linear-gradient(135deg,var(--paper) 0 12px,var(--line) 12px 13px);border-bottom:1px solid var(--line)}
@media (max-width:760px){.cols-sm-1{grid-template-columns:minmax(0,1fr)!important}}
</style>
</helmet>
<div class="pf {{themeClass}}" style="min-height: 100vh">
<dc-import name="SiteHeader" theme="{{theme}}" upwork="{{upwork}}" active="lab" hint-size="100%,72px"></dc-import>
<main class="wrap" style="padding-top: 64px; padding-bottom: 96px; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 680px">
<p class="label">Lab</p>
<h1 style="font-size: 48px; letter-spacing: -0.02em">Side projects</h1>
<p style="font-size: 18px; color: var(--muted)">Things I build on my own time, mostly with AI agents. They are where I try ideas before I use them for clients.</p>
</div>
<div class="cols-sm-1" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{lab}}" as="l" hint-placeholder-count="4">
<article class="card" style="display: flex; flex-direction: column; overflow: hidden">
<div class="shot" style="aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center"><span class="label">{{l.media}}</span></div>
<div style="padding: 22px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px"><h2 style="font-size: 24px">{{l.name}}</h2><span class="pill {{l.pillCls}}">{{l.status}}</span></div>
<p style="color: var(--muted)">{{l.summary}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{l.stack}}" as="s" hint-placeholder-count="3"><span class="tag">{{s}}</span></sc-for></div>
<sc-if value="{{l.hasLink}}" hint-placeholder-val="{{ false }}"><a href="{{l.link}}" style="font-weight: 600; margin-top: auto">See it on GitHub →</a></sc-if>
</div>
</article>
</sc-for>
</div>
</main>
<dc-import name="SiteFooter" theme="{{theme}}" upwork="{{upwork}}" hint-size="100%,220px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"upwork":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":1300}}'>
class Component extends DCLogic {
renderVals() {
const theme = this.props.theme ?? 'light';
const lab = [
{ name: 'hydra-claude', status: 'Public, in use', live: true, summary: 'A Claude Code plugin that gives Claude a memory for each repo. It saves corrections, rules and decisions, and brings them back when they matter.', stack: ['Claude Code plugin', 'Hooks', 'Skills', 'Bash'], link: 'https://github.com/son-nguyen-301/hydra-claude', media: 'Screenshot · a saved rule applied' },
{ name: 'GitHub task runner', status: 'Running', live: true, summary: 'A chain of Claude Code cloud sessions that works through a repo’s GitHub issues one at a time: build, review by a second agent, merge, then start the next run.', stack: ['Claude Code', 'Subagents', 'GitHub API'], link: '', media: 'Diagram · issue to merge' },
{ name: 'Looper', status: 'Build in progress', live: false, summary: 'A web app that takes one builder from idea to live app and keeps fixing it after launch. Claude Code does the building, and risk levels decide what it may do alone.', stack: ['Nuxt 4', 'PostgreSQL', 'Claude Code'], link: '', media: 'Screenshot · Looper board' },
{ name: 'Homereel', status: 'Live', live: true, summary: 'My own TV and phone app for watching movies and shows from my home server, on Google TV and Android.', stack: ['Kotlin', 'Jetpack Compose', 'Android TV'], link: '', media: 'Screenshot · TV home screen' }
].map(l => ({ ...l, hasLink: !!l.link, pillCls: l.live ? 'live' : '' }));
return { theme, upwork: !!this.props.upwork, themeClass: theme === 'dark' ? 'dark' : '', lab };
}
}
</script>
</body>
</html>

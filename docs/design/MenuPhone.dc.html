<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone menu, Upwork mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.pf{--paper:#F5F7F8;--surface:#FFFFFF;--ink:#141A22;--muted:#5A6472;--line:#DCE1E6;--jade:#0D7663;--jade-soft:#DCEFEA;--on-jade:#FFFFFF;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.6}
.pf.dark{--paper:#0E1216;--surface:#151B21;--ink:#E6EBF0;--muted:#9AA5B1;--line:#27303A;--jade:#43C2A8;--jade-soft:#15302A;--on-jade:#0E1216}
.pf p{margin:0}
.label{font:600 11px/1.3 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:8px;font:600 16px/1 Inter,system-ui,sans-serif;text-decoration:none;border:1px solid transparent;box-sizing:border-box}
.btn-action{background:var(--jade);color:var(--on-jade)!important}
.mlink{display:flex;justify-content:space-between;align-items:center;min-height:56px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font:600 24px/1 "Bricolage Grotesque",Inter,sans-serif}
.mlink.on{color:var(--jade)}
.seg{min-height:40px;flex:1;border:0;background:transparent;color:var(--muted);font:500 14px/1 Inter,sans-serif;border-radius:6px}
.seg.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
</style>
</helmet>
<div class="pf {{themeClass}}" role="dialog" aria-label="Menu" style="width: 390px; height: 844px; display: flex; flex-direction: column; box-sizing: border-box">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 16px; min-height: 60px; border-bottom: 1px solid var(--line)">
<span style="font: 700 17px/1 'Bricolage Grotesque', Inter, sans-serif">Hai Son<span style="color: var(--jade)">.</span></span>
<a href="HomePhone.dc.html" aria-label="Close menu" style="width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 8px; color: var(--ink)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
</div>
<nav aria-label="Main" style="padding: 16px 20px; display: flex; flex-direction: column">
<sc-for list="{{links}}" as="l" hint-placeholder-count="5">
<a class="mlink {{l.cls}}" href="{{l.href}}"><span>{{l.label}}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
</sc-for>
</nav>
<div style="margin-top: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--line)">
<sc-if value="{{upwork}}" hint-placeholder-val="{{ true }}">
<a class="btn btn-action" href="https://www.upwork.com/freelancers/~010a5da72f7f0ba777">Message me on Upwork</a>
</sc-if>
<sc-if value="{{notUpwork}}" hint-placeholder-val="{{ false }}">
<a class="btn btn-action" href="Contact.dc.html">Book a 30-minute call</a>
</sc-if>
<p style="font-size: 14px; color: var(--muted)">08:00 to 22:00 Hanoi time. I reply within 12 hours.</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<span class="label">Theme</span>
<div role="group" aria-label="Theme" style="display: flex; gap: 2px; padding: 3px; border-radius: 8px; border: 1px solid var(--line)">
<button type="button" class="seg on" aria-pressed="true">Light</button>
<button type="button" class="seg" aria-pressed="false">Dark</button>
<button type="button" class="seg" aria-pressed="false">System</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"upwork":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const upwork = this.props.upwork ?? true;
const all = [
{ label: 'Work', href: 'Work.dc.html', key: 'work' }, { label: 'Services', href: 'Services.dc.html', key: 'services' },
{ label: 'Lab', href: 'Lab.dc.html', key: 'lab' }, { label: 'About', href: 'About.dc.html', key: 'about' },
{ label: 'CV', href: 'CV.dc.html', key: 'cv' }, { label: 'Contact', href: 'Contact.dc.html', key: 'contact' }
];
const links = all.filter(l => !(upwork && l.key === 'contact')).map(l => ({ ...l, cls: l.key === 'work' ? 'on' : '' }));
return { upwork, notUpwork: !upwork, links, themeClass: this.props.theme === 'dark' ? 'dark' : '' };
}
}
</script>
</body>
</html>

# One-time job: remove the old AWS hosting stack (the site moves to Cloudflare).
# Runs only by hand, only on main, and only when you type "destroy".
# It keeps the GitHub OIDC provider and the github-terraform role, because this
# job signs in with that role. Delete those two by hand afterwards if you want.
name: destroy-aws
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to remove the AWS stack'
        required: true
permissions:
  id-token: write
  contents: read
concurrency: terraform-prod
jobs:
  destroy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra } }
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare token is set
        run: test -n "$TF_VAR_cloudflare_api_token" || { echo "CLOUDFLARE_API_TOKEN secret is missing"; exit 1; }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.13.5' }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::441353787478:role/github-terraform
          aws-region: ap-southeast-1
      - run: terraform init -input=false
      - name: Show what is in state
        run: terraform state list
      - name: Empty the assets bucket
        run: |
          BUCKET=$(terraform output -raw assets_bucket 2>/dev/null || true)
          if [ -n "$BUCKET" ]; then aws s3 rm "s3://$BUCKET" --recursive; fi
      - name: Destroy everything except the GitHub OIDC role
        run: |
          terraform destroy -input=false -auto-approve -no-color \
            -target=cloudflare_dns_record.site \
            -target=cloudflare_dns_record.acm_validation \
            -target=aws_acm_certificate_validation.site \
            -target=aws_acm_certificate.site \
            -target=aws_cloudfront_distribution.site \
            -target=aws_cloudfront_origin_access_control.s3 \
            -target=aws_cloudfront_origin_access_control.lambda \
            -target=aws_lambda_permission.cloudfront \
            -target=aws_lambda_function_url.ssr \
            -target=aws_lambda_function.ssr \
            -target=aws_iam_role_policy.ssr_logs \
            -target=aws_iam_role.ssr \
            -target=aws_cloudwatch_log_group.ssr \
            -target=aws_s3_bucket_policy.assets \
            -target=aws_s3_bucket_public_access_block.assets \
            -target=aws_s3_bucket_server_side_encryption_configuration.assets \
            -target=aws_s3_bucket.assets
      - name: Show what is left in state
        run: terraform state list

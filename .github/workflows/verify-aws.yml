name: verify-aws
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::441353787478:role/github-terraform
          aws-region: ap-southeast-1
      - run: aws sts get-caller-identity
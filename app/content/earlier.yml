aspire:
  - "Aspire Dashboard: the internal staff app for logins, business and identity checks (KYB and KYC), cards, budgets and businesses."
  - "Premium subscription: the paid plan customers need to keep premium features. Before it, everything was free."
  - "Bills and claims: submit a claim, scan a bill with OCR to fill in a claim, claims in many currencies, create and pay bills."
  - "Acting engineering manager for one 3-week sprint on the OCR bill scan: planned the sprint, split work across web, mobile and backend, tracked deadlines, ran meetings and talked to stakeholders."
  - "Helped junior and mid-level engineers through code review, setup calls, and walkthroughs of how the code is organized and how to debug it."
xtel:
  - name: "Base UI library"
    summary: "Internal library for back-office apps: login, role-based permissions, user and group management, data tables, pagination and notifications. Saved setup time on every new project."
  - name: "Luckybest Webview"
    summary: "Ticket buying in seconds, with several play modes and payments through Momo, ZaloPay, GPay, 9Pay, SGB and Appota. Team lead, team of 4. Aug 2020 to Jul 2021."
  - name: "Keno CMS"
    summary: "Admin tool for orders, revenue checks, results approval and reports. Team lead, team of 4. Aug to Oct 2019."
  - name: "RFID Portal"
    summary: "Warehouse app that talks to RFID scanners to track stock in and out, watch expiry dates and flag missing items. For a Singapore client. Team of 2. Oct 2019 to Jul 2021."
  - name: "Smart IOC"
    summary: "Web screen for an AI smart-home system: shows what the AI is doing and sends commands like lights on or off. Team lead, team of 2. Sep to Oct 2020."
  - name: "Airtables (Golden Gate Restaurants)"
    summary: "Restaurant booking site to browse brands and locations and see how far each one is. Solo. Aug 2020 to Jul 2021."
  - name: "Big Lottery (Đại Thần Tài)"
    summary: "Quick ticket buying with several play modes and Momo e-wallet payments. Team lead, team of 2. Sep 2020 to Jul 2021."
  - name: "Phố Hoa (Flower City)"
    summary: "Online flower shop with filters by price, occasion and flower type, and tools for sellers to manage stock and orders. Built with search engines in mind. Solo. Nov 2019 to Aug 2020."
